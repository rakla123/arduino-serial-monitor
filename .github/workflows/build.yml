name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build release configuration
        shell: pwsh
        run: msbuild .\ArduinoSerialMonitor.sln /restore /m /p:Configuration=Release /p:Platform="Any CPU" /warnaserror
